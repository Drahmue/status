[Paths]
#path for all files Import Export and systemfiles, if "Default" then path of the Skript itself is used
#path Format is as given in Windows (Spaces allowed, Backslash allowed)
path = default

[Files]
#filename instruments wihout path
prices = prices.parquet
logfile = status.log
instruments = D:\Dataserver\Dummy\Finance_Input\Instrumente.xlsx
#bookings nur noch fuer Testskripte test_*.py; status.py liest seit DH-050 die Stueckzahlen aus shares_day (depot, taeglich 05:00)
bookings = D:\Dataserver\Dummy\Finance_Input\bookings.xlsx
shares_day = D:\Dataserver\Dummy\Finance_Output\shares_day.xlsx

[Export]
# True und False müssen groß geschrieben werden, immer doppelte Anführungszeichen verwenden
# Achtung für Format Angaben: #,##0.0 entspricht #.##,0
#

[Output]
screen = True
debug = False

[Timing]
refresh_time = 60
#Warnung im Log, wenn shares_day.xlsx aelter ist (depot ausgefallen)
shares_day_max_age_hours = 30
