[Files]
# Logfile name/path
logfile = logs\status_zaehler.log

# JSON output file for meter readings
json_output = static\zaehler.json

[Geraete]
# Gas meter (Smartnetz Gas Reader - Tasmota)
gas_url = http://192.168.178.130/?m=1

# Electricity meter (Hichi Lesekopf - Tasmota)
strom_url = http://192.168.178.133/?m=1

[Timing]
# Update cycle time in seconds (300 = 5 minutes)
refresh_time = 300

# HTTP request timeout in seconds
request_timeout = 10
