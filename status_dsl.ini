[Files]
# Logfile name/path - stored in the same directory as the script
logfile = status_dsl.log

# JSON output file for speedtest results
json_output = static\speedtest.json

# Parquet file for efficient data storage (historical speedtest data)
parquet_data = speedtest_data.parquet

[Speedtest]
# Path to Ookla CLI speedtest executable
# Leave empty to use only Python speedtest library
cli_path = ookla\speedtest.exe

# Use Ookla CLI if available (True/False)
use_ookla_cli = True

# Use secure connection (True/False)
secure = True

# Preferred server ID (Deutsche Telekom Stuttgart: 74184)
# Telekom Frankfurt (31448) was removed by Ookla around 2026-09-30
# List available servers: ookla\speedtest.exe --servers
# Leave empty for automatic server selection
server_id = 74184

# Server filters (used by Python-lib fallback when server_id is not available)
# Matching is relaxed step by step: sponsor+city+country -> sponsor+country -> country
sponsor = Telekom
city = Stuttgart
country = Germany

# Plausibility limit: results with a higher ping are discarded as measurement errors
max_ping_ms = 1000

[Timing]
# Update cycle time in seconds (300 = 5 minutes)
refresh_time = 600